[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-wise"
version = "2.0.0"
description = "Lightweight SSH client wrapper around paramiko with colored logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Klaus Moser" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "paramiko>=3.0",
    "log-wise @ git+ssh://git@github.com/tg4nd4lf/log-wise.git",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/tg4nd4lf/ssh-wise"
